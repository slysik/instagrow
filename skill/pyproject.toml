[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domino-skill"
version = "0.1.0"
description = "Python SDK for HCL Domino REST API (DRAPI) — documents, views, agents, scopes, design, admin, PIM, with FTS eval framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Domino Skill Contributors" }]
keywords = ["domino", "hcl", "rest-api", "drapi", "keep", "notes", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.8",
]

[project.scripts]
domino = "domino_skill.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/domino_skill"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
